name: Build DA4R Addin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '4.8.x'

      - name: Build RoomDataExtractor
        run: dotnet build RoomDataExtractor.csproj -c Release
        shell: pwsh

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomDataExtractor-dll
          path: |
            bin/Release/net48/RoomDataExtractor.dll
            bin/Release/net48/Newtonsoft.Json.dll
          retention-days: 30
