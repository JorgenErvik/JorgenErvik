name: Build DA4R Addin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore RoomDataExtractor.csproj
        shell: pwsh

      - name: Build RoomDataExtractor
        run: msbuild RoomDataExtractor.csproj /p:Configuration=Release /p:Platform=x64
        shell: pwsh

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomDataExtractor-dll
          path: |
            bin/x64/Release/RoomDataExtractor.dll
            bin/x64/Release/Newtonsoft.Json.dll
          retention-days: 30
