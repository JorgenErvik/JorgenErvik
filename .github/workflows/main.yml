name: Build DA4R Addin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download NuGet packages
        run: |
          nuget install Autodesk.Forge.DesignAutomation.Revit -Version 2024.0.2 -OutputDirectory packages
          nuget install Newtonsoft.Json -Version 13.0.3 -OutputDirectory packages
        shell: pwsh

      - name: Build RoomDataExtractor
        run: msbuild RoomDataExtractor.csproj /p:Configuration=Release
        shell: pwsh

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomDataExtractor-dll
          path: |
            bin/Release/RoomDataExtractor.dll
            bin/Release/Newtonsoft.Json.dll
          retention-days: 30
